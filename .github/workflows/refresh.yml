name: Refresh data and deploy

# Monthly: the DGAC publishes the airfare index (IPTAP) of month M after the 15th of M+1.
# Fetches the 3 DGAC datasets, rebuilds the JSON, runs every test against the real files
# (a failing reference check blocks the deploy), commits the refreshed JSON and deploys to Pages.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 16 * *"
  push:
    branches: [main]
    paths: [etl/**, web/src/**, web/index.html, .github/workflows/refresh.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fetch DGAC data
        run: python etl/fetch.py
      - name: Build JSON
        run: python etl/build.py
      - name: ETL and reference tests (real data)
        run: |
          pip install -q pytest
          python -m pytest -q
      - name: Front tests and build
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet || git commit -m "data: DGAC refresh $(date -u +%Y-%m-%d)" && git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
