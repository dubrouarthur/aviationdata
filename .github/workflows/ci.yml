name: CI

# Every pull request and every push outside main: lint, types, unit tests, build, ETL tests.
# Reference tests that need data/raw/ are skipped here (the monthly refresh runs them on real files).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types (files marked // @ts-check)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pytest ruff numpy pandas
      - name: Lint (ruff)
        run: ruff check etl/jets tests/test_jets.py
      - name: ETL tests
        run: python -m pytest -q
