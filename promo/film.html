<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Le ciel à deux vitesses, film</title>
    <style>
      /* Layout: 1920x1080 editorial stage. Headline column on the left, the chart itself laid
         straight onto the paper on the right (no page, no window), two flight arcs (fast blue,
         slow magenta) as the "deux vitesses" motif on the title and end cards. */
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212;
      }
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/node_modules/@fontsource-variable/archivo/files/archivo-latin-ext-wdth-normal.woff2) format("woff2-variations");
        unicode-range: U+0100-02AF, U+2190-21FF;
      }
      @font-face {
        font-family: "Source Serif 4 Variable";
        font-weight: 200 900;
        src: url(../web/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2) format("woff2-variations");
      }
      :root {
        --paper: #f6f8f6;
        --ink: #0f1c2b;
        --ink-2: #3e4c5e;
        --muted: #6f7c8b;
        --rule: #dbe2df;
        --blue: #2a78d6;
        --magenta: #b5267e;
        --teal: #138a6e;
        --f-display: "Archivo Variable", "Arial Narrow", sans-serif;
        --f-text: "Source Serif 4 Variable", Georgia, serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--f-display);
      }
      #motif {
        position: absolute;
        inset: 0;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 19px;
        font-weight: 650;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .eyebrow i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--c, var(--blue));
      }
      .wordmark {
        font-stretch: 66%;
        font-weight: 820;
        line-height: 0.84;
        letter-spacing: -0.01em;
      }
      .wordmark em {
        font-style: normal;
        color: var(--blue);
      }

      /* title + end cards */
      .card {
        position: absolute;
        left: 132px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        width: 1100px;
      }
      .card h1 {
        margin: 0;
        font-size: 212px;
      }
      #end {
        gap: 26px;
        width: 1140px;
      }
      #end h1 {
        font-size: 128px;
      }
      #end p {
        font-size: 36px;
        max-width: 1000px;
      }
      /* call to action: where to explore the data */
      .cta {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 18px;
      }
      .cta .url {
        position: relative;
        display: inline-flex;
        align-items: baseline;
        gap: 26px;
        align-self: flex-start;
        padding-bottom: 14px;
        font-size: 112px;
        font-stretch: 68%;
        font-weight: 820;
        line-height: 0.95;
        letter-spacing: -0.005em;
        white-space: nowrap;
        color: var(--ink);
      }
      .cta .url b {
        color: var(--blue);
        font-weight: 700;
      }
      .cta .uline {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        border-radius: 4px;
        background: var(--blue);
        transform-origin: 0 50%;
      }
      .cta .list {
        font-family: var(--f-text);
        font-size: 30px;
        color: var(--ink-2);
      }
      #progress {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        background: var(--blue);
        opacity: 0.85;
      }
      .card p {
        margin: 0;
        font-family: var(--f-text);
        font-size: 38px;
        line-height: 1.35;
        color: var(--ink-2);
        max-width: 900px;
      }
      .source {
        font-size: 22px;
        color: var(--muted);
        font-weight: 550;
        letter-spacing: 0.01em;
      }

      /* author: portrait + LinkedIn, on the title card, the footer and the end card */
      .portrait {
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 28%;
        background: var(--rule);
      }
      .byline {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .byline .portrait {
        width: 108px;
        height: 108px;
        box-shadow:
          0 0 0 4px var(--paper),
          0 0 0 6px var(--rule);
      }
      .byline b {
        display: block;
        font-size: 36px;
        font-weight: 760;
        font-stretch: 78%;
        color: var(--ink);
      }
      .byline span {
        display: block;
        margin-top: 4px;
        font-size: 23px;
        font-weight: 600;
        color: var(--blue);
      }
      #author {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 110px;
        width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
      }
      #author .portrait {
        width: 300px;
        height: 300px;
        margin-bottom: 18px;
        box-shadow:
          0 0 0 8px var(--paper),
          0 0 0 11px var(--blue);
      }
      #author b {
        font-size: 64px;
        font-stretch: 70%;
        font-weight: 800;
        line-height: 1;
      }
      #author .li {
        font-size: 28px;
        font-weight: 650;
        color: var(--blue);
      }
      #author .hint {
        max-width: 400px;
        font-family: var(--f-text);
        font-size: 25px;
        line-height: 1.35;
        color: var(--ink-2);
      }

      /* headline column */
      #cap {
        position: absolute;
        left: 110px;
        top: 0;
        bottom: 0;
        width: 470px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
      }
      #cap h2 {
        margin: 0;
        font-size: 88px;
        font-stretch: 68%;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.005em;
        text-wrap: balance;
      }
      #cap h2 .n,
      #cap h2 .a {
        color: var(--c);
        font-variant-numeric: tabular-nums;
      }
      #cap p {
        margin: 0;
        font-family: var(--f-text);
        font-size: 29px;
        line-height: 1.42;
        color: var(--ink-2);
      }

      /* the chart, straight on the paper */
      #chart {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* each chart lies on a sheet of paper that lifts in with a slight tilt, then drifts (slow camera push) */
      #chart .frame {
        position: absolute;
        transform-origin: 50% 85%;
        background: #ffffff;
        border-radius: 26px;
        box-shadow:
          0 1px 3px rgba(15, 28, 43, 0.05),
          0 26px 70px rgba(15, 28, 43, 0.12);
      }
      #chart img {
        position: absolute;
      }
      /* depth: a tinted light behind the chart and the scene's number, huge and faint, drifting slower */
      #spot {
        position: absolute;
        width: 1500px;
        height: 1500px;
        border-radius: 50%;
        pointer-events: none;
      }
      #bgnum {
        position: absolute;
        right: -40px;
        bottom: -90px;
        font-family: var(--f-display);
        font-stretch: 62%;
        font-weight: 850;
        font-size: 640px;
        line-height: 0.8;
        letter-spacing: -0.02em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
      }
      #swoosh {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #counter {
        position: absolute;
        right: 110px;
        top: 60px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #counter b {
        color: var(--ink);
      }
      /* headline words rise from behind a mask, one after the other */
      #cap h2 .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0.12em 0 0.1em;
        margin: -0.12em 0 -0.1em;
      }
      #cap h2 .w > span {
        display: inline-block;
      }
      #kicker {
        position: absolute;
        font-size: 21px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #kicker::before {
        content: "";
        display: inline-block;
        width: 26px;
        height: 2px;
        margin-right: 12px;
        vertical-align: middle;
        background: var(--rule);
      }
      #badge {
        position: absolute;
        font-stretch: 62%;
        font-weight: 820;
        line-height: 0.85;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      #foot {
        position: absolute;
        left: 110px;
        bottom: 70px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #foot .wordmark {
        font-size: 32px;
      }
      #foot .line {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 550;
        color: var(--muted);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      #foot .line b {
        color: var(--ink);
        font-weight: 680;
      }
      #foot .sep {
        width: 1px;
        height: 18px;
        margin: 0 8px;
        background: var(--rule);
      }
      #foot .portrait {
        width: 26px;
        height: 26px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="spot"></div>
      <div id="bgnum"></div>
      <svg id="motif" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="arc-fast" d="M 640 1180 Q 1240 -90 2060 250" fill="none" stroke="#2a78d6" stroke-width="2.5" />
        <path id="arc-slow" d="M 860 1180 Q 1420 560 2060 730" fill="none" stroke="#b5267e" stroke-width="2.5" />
        <g id="dots"></g>
        <g id="tags" font-family="Archivo Variable" font-size="24" font-weight="650">
          <text id="tag-fast" x="1555" y="182" fill="#2a78d6">international +7&#8239;% depuis 2019</text>
          <text id="tag-slow" x="1520" y="640" fill="#b5267e">intérieur −21&#8239;%</text>
        </g>
      </svg>

      <section class="card" id="title">
        <div class="eyebrow"><i></i><span data-k="eyebrow"></span></div>
        <h1 class="wordmark"><span class="l1">Le ciel à</span><br /><em class="l2">deux vitesses</em></h1>
        <p data-k="sub"></p>
        <div class="byline">
          <img class="portrait" src="out/portrait.jpg" alt="" />
          <div><b data-k="author"></b><span data-k="linkedin"></span></div>
        </div>
      </section>

      <section class="card" id="end">
        <h1 class="wordmark"><span class="l1">Le ciel à</span><br /><em class="l2">deux vitesses</em></h1>
        <p data-k="sub"></p>
        <div class="cta">
          <div class="eyebrow"><i></i><span data-k="cta"></span></div>
          <div class="url"><span data-k="url"></span><b>→</b><i class="uline"></i></div>
          <div class="list" data-k="list"></div>
        </div>
        <div class="source" data-k="source"></div>
      </section>

      <aside id="author">
        <img class="portrait" src="out/portrait.jpg" alt="" />
        <div class="eyebrow"><i></i><span data-k="by"></span></div>
        <b data-k="author"></b>
        <div class="li" data-k="linkedin"></div>
        <div class="hint" data-k="hint"></div>
      </aside>

      <svg id="swoosh" viewBox="0 0 1920 1080" aria-hidden="true">
        <path id="sw-path" fill="none" stroke-width="3" stroke-linecap="round" />
        <circle id="sw-dot" r="8" />
      </svg>
      <div id="chart">
        <div class="frame" id="frame-a"><img alt="" /></div>
        <div class="frame" id="frame-b"><img alt="" /></div>
        <div id="kicker"></div>
        <div id="badge"></div>
      </div>

      <section id="cap">
        <div class="eyebrow"><i></i><span class="ey"></span></div>
        <h2></h2>
        <p></p>
      </section>

      <div id="foot">
        <div class="wordmark">Le ciel à <em>deux vitesses</em></div>
        <div class="line">
          <span>Explorez les données sur <b>aviationdata.vercel.app</b></span><i class="sep"></i
          ><img class="portrait" src="out/portrait.jpg" alt="" /><span><b>Arthur Dubrou</b> · linkedin.com/in/arthur-dubrou</span>
        </div>
      </div>
      <div id="progress"></div>
      <div id="counter"></div>
    </div>

    <script>
      const COLORS = { blue: "#2a78d6", magenta: "#b5267e", teal: "#138a6e" };
      const AREA = { x: 660, y: 120, w: 1180, h: 860 }; // where charts are laid out
      // French typography: thin no-break spaces before % ? ! and no-break before :
      const fr = (s) =>
        s
          .replace(/ %/g, " %")
          .replace(/ \?/g, " ?")
          .replace(/ !/g, " !")
          .replace(/ :/g, " :");
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const lin = (t, a, b) => clamp((t - a) / (b - a));
      const outCubic = (t) => 1 - (1 - t) ** 3;
      const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
      const $ = (s) => document.querySelector(s);

      let FPS, SCENES, TOTAL;
      const ready = fetch("scenes.json")
        .then((r) => r.json())
        .then((d) => {
          FPS = d.fps;
          let t = 0;
          SCENES = d.scenes.map((s) => {
            const sc = { ...s, start: t, frames: Math.round(s.dur * d.fps), film: !!s.target };
            t += s.dur;
            return sc;
          });
          TOTAL = t;
          return Promise.all(
            SCENES.filter((s) => s.film).map((s) =>
              fetch(`out/raw/${s.id}/meta.json`)
                .then((r) => r.json())
                .then((m) => (s.meta = m)),
            ),
          );
        })
        .then(() => {
          for (const [id, from] of [["title", "title"], ["end", "end"], ["author", "end"]]) {
            const s = SCENES.find((x) => x.id === from);
            document.querySelectorAll(`#${id} [data-k]`).forEach((n) => (n.textContent = fr(s[n.dataset.k] || "")));
          }
          return document.fonts.ready;
        })
        .then(() => ({ total: TOTAL, fps: FPS }));

      const frameSrc = (id, f) => `out/raw/${id}/${String(f).padStart(4, "0")}.png`;
      const show = (node, o, dy = 0) => {
        node.style.opacity = o;
        node.style.transform = `translateY(${dy}px)`;
      };
      // element enters (rise + fade) between a and a+d, leaves (lift + fade) between b and b+e
      const inout = (node, t, a, b, d = 0.55, e = 0.32, rise = 34) => {
        const i = outCubic(lin(t, a, a + d));
        const o = lin(t, b, b + e) ** 2;
        show(node, i * (1 - o), (1 - i) * rise - o * 22);
      };
      const PAD = 38; // sheet margin around the chart
      const fit = (sc) => {
        const k = Math.min((AREA.w - 2 * PAD) / sc.meta.w, (AREA.h - 2 * PAD) / sc.meta.h);
        const w = sc.meta.w * k;
        const h = sc.meta.h * k;
        return { x: AREA.x + (AREA.w - w) / 2, y: AREA.y + 30 + (AREA.h - h) / 2, w, h };
      };
      // the scene's first number, as written in the headline ("183", "+7 %"), for the background
      const bgText = (sc) => {
        const k = (sc.headline || []).findIndex((x) => typeof x === "object" && x.n !== undefined);
        if (k < 0) return "";
        const part = sc.headline[k];
        const next = sc.headline[k + 1];
        const pct = typeof next === "string" && /^\s*%/.test(next) ? " %" : "";
        return fr(`${part.sign || ""}${num(part.n, part.dec)}${pct}`);
      };
      const num = (v, dec) => (dec ? v.toFixed(dec).replace(".", ",") : String(Math.round(v)));

      function countText(part, u, sc) {
        if (part.live && sc.meta.live) {
          const f = Math.min(sc.meta.live.length - 1, Math.floor(u * FPS + 1e-6));
          return `${part.sign || ""}${sc.meta.live[f] ?? part.n}`;
        }
        const k = outCubic(lin(u, 0.12, 0.95));
        const from = part.from ?? 0;
        return `${part.sign || ""}${num(from + (part.n - from) * k, part.dec)}`;
      }

      let capFor = null;
      let capNums = [];
      let capWords = [];
      // one masked word; a token glued by a no-break space (" %") joins the previous word
      function words(h2, parts) {
        capNums = [];
        capWords = [];
        const out = [];
        const add = (content) => {
          const w = document.createElement("span");
          w.className = "w";
          const inner = document.createElement("span");
          inner.append(content);
          w.append(inner);
          capWords.push(inner);
          out.push(w);
        };
        parts.forEach((part) => {
          if (typeof part === "string") {
            fr(part)
              .split(/( +)/)
              .forEach((tok) => {
                if (!tok) return;
                if (/^ +$/.test(tok)) out.push(document.createTextNode(" "));
                else if (/^[\u00a0\u202f]/.test(tok) && capWords.length) capWords.at(-1).append(tok);
                else add(tok);
              });
          } else {
            const span = document.createElement("span");
            span.className = part.a ? "a" : "n";
            span.textContent = fr(part.a || "");
            if (part.n !== undefined) capNums.push([part, span]);
            add(span);
          }
        });
        h2.replaceChildren(...out);
      }
      function caption(sc, u) {
        const cap = $("#cap");
        cap.style.setProperty("--c", COLORS[sc.accent] || COLORS.blue);
        const h2 = cap.querySelector("h2");
        if (capFor !== sc.id) {
          capFor = sc.id;
          const len = sc.headline.map((x) => (typeof x === "string" ? x : x.a || String(x.n))).join("").length;
          h2.style.fontSize = len > 34 ? "76px" : len > 26 ? "82px" : "88px";
          cap.querySelector("p").textContent = fr(sc.sub || "");
          cap.querySelector(".ey").textContent = fr(sc.eyebrow);
          words(h2, sc.headline);
        }
        capNums.forEach(([part, span]) => (span.textContent = countText(part, u, sc)));
        const end = sc.dur - 0.34;
        inout(cap.querySelector(".eyebrow"), u, 0.1, end);
        capWords.forEach((w, i) => {
          const k = outCubic(lin(u, 0.16 + i * 0.05, 0.7 + i * 0.05));
          const o = lin(u, end, end + 0.3) ** 2;
          w.style.transform = `translateY(${((1 - k) * 110 - o * 30).toFixed(1)}%)`;
          w.style.opacity = (1 - o).toFixed(3);
        });
        inout(cap.querySelector("p"), u, 0.45, end);
      }

      function motif(t, strength, tags) {
        const fast = $("#arc-fast");
        const slow = $("#arc-slow");
        fast.style.opacity = slow.style.opacity = strength * 0.9;
        const dots = [];
        const run = (path, color, speed, n) => {
          const L = path.getTotalLength();
          for (let k = 0; k < n; k++) {
            const p0 = (((t * speed + k / n) % 1) + 1) % 1;
            for (let j = 0; j < 7; j++) {
              const pt = path.getPointAtLength(clamp(p0 - j * 0.006) * L);
              const r = j === 0 ? 7 : 5.2 - j * 0.6;
              const a = (j === 0 ? 1 : 0.5 - j * 0.06) * strength;
              dots.push(`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${r}" fill="${color}" opacity="${a.toFixed(3)}"/>`);
            }
          }
        };
        run(fast, COLORS.blue, 0.21, 3);
        run(slow, COLORS.magenta, 0.075, 3);
        $("#dots").innerHTML = dots.join("");
        $("#tag-fast").style.opacity = tags;
        $("#tag-slow").style.opacity = tags;
      }

      function place(frameNode, sc, f, opacity, dy = 0, scale = 1, wipe = 1, tilt = 0) {
        if (!sc) {
          frameNode.style.visibility = "hidden";
          return null;
        }
        const box = fit(sc);
        frameNode.style.visibility = "visible";
        Object.assign(frameNode.style, {
          left: `${box.x - PAD}px`,
          top: `${box.y - PAD}px`,
          width: `${box.w + 2 * PAD}px`,
          height: `${box.h + 2 * PAD}px`,
          opacity,
          transform: `perspective(1800px) translateY(${dy.toFixed(1)}px) rotateX(${tilt.toFixed(2)}deg) scale(${scale.toFixed(4)})`,
        });
        const img = frameNode.querySelector("img");
        Object.assign(img.style, {
          left: `${PAD}px`,
          top: `${PAD}px`,
          width: `${box.w}px`,
          height: `${box.h}px`,
          clipPath: wipe < 1 ? `inset(-2% ${((1 - wipe) * 102).toFixed(2)}% -2% -2%)` : "none",
        });
        const src = frameSrc(sc.id, Math.max(0, Math.min(sc.frames - 1, f)));
        if (!img.src.endsWith(src)) {
          img.src = src;
          return img.decode().catch(() => {});
        }
        return null;
      }

      async function render(t) {
        let k = SCENES.findIndex((s) => t < s.start + s.dur);
        if (k < 0) k = SCENES.length - 1;
        const sc = SCENES[k];
        const u = t - sc.start;
        const prev = SCENES[k - 1];
        const loads = [];

        // ------------------------------------------------ chart frames
        const A = $("#frame-a");
        const B = $("#frame-b");
        const kicker = $("#kicker");
        const badge = $("#badge");
        if (sc.film) {
          const f = Math.floor(u * FPS + 1e-6);
          const enter = outCubic(lin(u, 0.2, 1.0));
          const wipe = sc.reveal === "wipe" ? inOut(lin(u, 0.35, 2.0)) : 1;
          const push = 1 + 0.03 * inOut(lin(u, 0.6, sc.dur));
          loads.push(place(B, sc, f, enter, (1 - enter) * 70, (0.94 + 0.06 * enter) * push, wipe, (1 - enter) * 14));
          if (prev && prev.film && u < 0.36) {
            const out = 1 - lin(u, 0, 0.32);
            loads.push(place(A, prev, prev.frames - 1, out, -40 * (1 - out), 1.03 + 0.05 * (1 - out)));
          } else place(A, null);
          const box = fit(sc);
          kicker.textContent = fr(sc.kicker || "");
          kicker.style.left = `${box.x - PAD + 6}px`;
          kicker.style.top = `${Math.max(48, box.y - PAD - 42)}px`;
          // depth: tinted light behind the sheet, the scene's number huge and faint, drifting slower than the sheet
          const tint = { blue: "42,120,214", magenta: "181,38,126", teal: "19,138,110" }[sc.accent] || "42,120,214";
          const spot = $("#spot");
          spot.style.background = `radial-gradient(closest-side, rgba(${tint},0.14), rgba(${tint},0) 72%)`;
          spot.style.left = `${box.x + box.w / 2 - 750 + 40 * Math.sin(u * 0.6)}px`;
          spot.style.top = `${box.y + box.h / 2 - 750 + 30 * Math.cos(u * 0.5)}px`;
          spot.style.opacity = (enter * (1 - lin(u, sc.dur - 0.3, sc.dur))).toFixed(3);
          const bg = $("#bgnum");
          bg.textContent = bgText(sc);
          bg.style.color = COLORS[sc.accent] || COLORS.blue;
          bg.style.opacity = (0.07 * outCubic(lin(u, 0.2, 1.0)) * (1 - lin(u, sc.dur - 0.35, sc.dur))).toFixed(4);
          bg.style.transform = `translateX(${(60 - 120 * (u / sc.dur)).toFixed(1)}px)`;
          // a plane streaks across at the cut
          const sw = lin(u, 0, 0.62);
          const path = $("#sw-path");
          const dot = $("#sw-dot");
          if (sw < 1) {
            const films = SCENES.filter((x) => x.film);
            const k2 = films.indexOf(sc) % 2;
            path.setAttribute("d", k2 ? "M -80 980 Q 900 120 2000 260" : "M -80 200 Q 1000 1040 2000 820");
            const L = path.getTotalLength();
            const pr = outCubic(sw);
            path.style.stroke = COLORS[sc.accent] || COLORS.blue;
            path.style.strokeDasharray = `${L * 0.28} ${L}`;
            path.style.strokeDashoffset = `${(L * 0.28 - pr * L * 1.28).toFixed(1)}`;
            const pt = path.getPointAtLength(Math.min(L, pr * L));
            dot.setAttribute("cx", pt.x.toFixed(1));
            dot.setAttribute("cy", pt.y.toFixed(1));
            dot.style.fill = COLORS[sc.accent] || COLORS.blue;
            path.style.opacity = dot.style.opacity = (1 - lin(u, 0.4, 0.62)).toFixed(3);
          } else path.style.opacity = dot.style.opacity = 0;
          // chapter counter
          const films = SCENES.filter((x) => x.film);
          const counter = $("#counter");
          counter.innerHTML = `<b>${String(films.indexOf(sc) + 1).padStart(2, "0")}</b> / ${String(films.length).padStart(2, "0")}`;
          inout(counter, u, 0.2, sc.dur - 0.34);
          inout(kicker, u, 0.25, sc.dur - 0.34);
          if (sc.badge && sc.meta.live) {
            const right = sc.id !== "france";
            badge.textContent = sc.meta.live[Math.min(sc.meta.live.length - 1, f)];
            badge.style.fontSize = right ? "64px" : "120px";
            badge.style.textAlign = right ? "right" : "left";
            badge.style.width = "420px";
            badge.style.left = `${right ? box.x + box.w - 420 : box.x}px`;
            badge.style.top = `${box.y + (right ? -70 : 6)}px`;
            inout(badge, u, 0.2, sc.dur - 0.34);
          } else badge.style.opacity = 0;
        } else {
          kicker.style.opacity = 0;
          badge.style.opacity = 0;
          $("#spot").style.opacity = 0;
          $("#bgnum").style.opacity = 0;
          $("#counter").style.opacity = 0;
          $("#sw-path").style.opacity = $("#sw-dot").style.opacity = 0;
          place(B, null);
          if (sc.id === "end" && prev && prev.film && u < 0.5) {
            const out = 1 - lin(u, 0, 0.45);
            loads.push(place(A, prev, prev.frames - 1, out, -14 * (1 - out)));
          } else place(A, null);
        }

        // ------------------------------------------------ title card
        const title = $("#title");
        title.style.display = sc.id === "title" ? "flex" : "none";
        if (sc.id === "title") {
          const leave = sc.dur - 0.7;
          inout(title.querySelector(".eyebrow"), u, 0.05, leave, 0.6);
          inout(title.querySelector(".l1"), u, 0.12, leave, 0.7, 0.4, 60);
          inout(title.querySelector(".l2"), u, 0.26, leave, 0.7, 0.4, 60);
          inout(title.querySelector("p"), u, 0.55, leave, 0.6);
          inout(title.querySelector(".byline"), u, 0.95, leave, 0.6);
          title.querySelector(".l1").style.display = title.querySelector(".l2").style.display = "inline-block";
        }

        // ------------------------------------------------ end card
        const end = $("#end");
        end.style.display = sc.id === "end" ? "flex" : "none";
        if (sc.id === "end") {
          inout(end.querySelector(".l1"), u, 0.3, 99, 0.7, 0.3, 60);
          inout(end.querySelector(".l2"), u, 0.42, 99, 0.7, 0.3, 60);
          inout(end.querySelector("p"), u, 0.7, 99);
          // the call to action lands once the closing line has been read, then holds still
          inout(end.querySelector(".cta .eyebrow"), u, 1.7, 99);
          inout(end.querySelector(".cta .url"), u, 1.85, 99, 0.6, 0.3, 46);
          end.querySelector(".uline").style.transform = `scaleX(${inOut(lin(u, 2.3, 3.0)).toFixed(4)})`;
          inout(end.querySelector(".cta .list"), u, 2.4, 99);
          inout(end.querySelector(".source"), u, 2.7, 99);
          end.querySelector(".l1").style.display = end.querySelector(".l2").style.display = "inline-block";
        }
        const author = $("#author");
        author.style.display = sc.id === "end" ? "flex" : "none";
        if (sc.id === "end") {
          const img = author.querySelector(".portrait");
          const k = outCubic(lin(u, 2.9, 3.6));
          img.style.opacity = k;
          img.style.transform = `scale(${(0.9 + 0.1 * k).toFixed(4)})`;
          inout(author.querySelector(".eyebrow"), u, 3.15, 99);
          inout(author.querySelector("b"), u, 3.25, 99);
          inout(author.querySelector(".li"), u, 3.4, 99);
          inout(author.querySelector(".hint"), u, 3.6, 99);
        }

        // ------------------------------------------------ headline column and footer
        const cap = $("#cap");
        cap.style.display = sc.film ? "flex" : "none";
        if (sc.film) caption(sc, u);
        $("#foot").style.opacity =
          sc.id === "title" ? lin(u, sc.dur - 0.5, sc.dur) : sc.id === "end" ? 1 - lin(u, 0, 0.4) : 1;

        // ------------------------------------------------ motif: strong on the cards, gone behind charts
        const strong =
          sc.id === "title" ? 1 - inOut(lin(u, sc.dur - 0.8, sc.dur)) : 0; // the end card belongs to the call to action and the author
        const tags = sc.id === "title" ? lin(u, 0.9, 1.4) * (1 - lin(u, sc.dur - 1.0, sc.dur - 0.6)) : 0;
        motif(t, strong, tags);
        $("#progress").style.width = `${((t / TOTAL) * 100).toFixed(3)}%`;

        await Promise.all(loads.filter(Boolean));
      }
      window.render = render;
      window.ready = ready;
    </script>
  </body>
</html>
