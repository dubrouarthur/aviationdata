<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Le ciel à deux vitesses, reel</title>
    <style>
      /* Layout: a 1080x1350 (4:5) reel for LinkedIn. Real footage fills the frame; on chart beats it
         blurs and darkens behind the dashboard's charts, filmed in light ink (capture.py --theme dark).
         Number beats: one big figure at the bottom over the clear footage. Footer: the dashboard's
         address and the author, on every beat but the title and the final call to action. */
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2) format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2212;
      }
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/src/fonts/nnbsp.woff) format("woff");
        unicode-range: U+202F;
      }
      @font-face {
        font-family: "Source Serif 4 Variable";
        font-weight: 200 900;
        src: url(../web/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2) format("woff2-variations");
      }
      :root {
        --navy: #0b1522;
        --white: #f5f7f9;
        --soft: rgba(245, 247, 249, 0.78);
        --blue: #4d9bff;
        --magenta: #ff4da6;
        --teal: #25c79c;
        --ochre: #f3b23c;
      }
      html,
      body {
        margin: 0;
        background: var(--navy);
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--navy);
        color: var(--white);
        font-family: "Archivo Variable", "Arial Narrow", sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 45%;
      }
      #tint {
        position: absolute;
        inset: 0;
        background: var(--navy);
      }
      /* top and bottom shades: type always sits on dark */
      #shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to bottom, rgba(6, 12, 20, 0.62) 0%, rgba(6, 12, 20, 0) 26%),
          linear-gradient(to top, rgba(6, 12, 20, 0.86) 0%, rgba(6, 12, 20, 0.42) 30%, rgba(6, 12, 20, 0) 56%);
      }
      #shade-num {
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(6, 12, 20, 0.9) 0%, rgba(6, 12, 20, 0.7) 32%, rgba(6, 12, 20, 0) 64%);
      }
      #chart {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 50% 50%;
      }
      #chart img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding-bottom: 0.08em;
        margin-bottom: -0.08em;
      }
      .w > span {
        display: inline-block;
        will-change: transform;
      }
      .shadow {
        text-shadow: 0 2px 22px rgba(0, 0, 0, 0.38);
      }
      /* the topic of each slide, read first: large enough for a phone held at arm's length */
      .kicker {
        font-size: 52px;
        font-stretch: 76%;
        font-weight: 780;
        line-height: 1.05;
      }
      /* ---------------------------------------------------------------- number beats */
      #big {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 150px;
      }
      #big .num {
        font-size: 270px;
        font-stretch: 62%;
        font-weight: 850;
        line-height: 0.84;
        letter-spacing: -0.012em;
        font-variant-numeric: tabular-nums;
        margin: 14px 0 6px;
      }
      #big .num .unit {
        font-size: 0.4em;
        font-stretch: 70%;
        letter-spacing: 0;
        margin-left: 0.12em;
      }
      #top {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 74px;
        font-size: 32px;
        font-stretch: 85%;
        font-weight: 650;
        color: var(--soft);
      }
      #big .line {
        font-size: 62px;
        font-stretch: 75%;
        font-weight: 700;
        line-height: 1.08;
      }
      /* ---------------------------------------------------------------- chart beats */
      #head {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 96px;
      }
      #head h2 {
        margin: 14px 0 0;
        font-size: 74px;
        font-stretch: 72%;
        font-weight: 820;
        line-height: 1.02;
        letter-spacing: -0.005em;
      }
      #note {
        position: absolute;
        left: 72px;
        right: 72px;
        font-family: "Source Serif 4 Variable", Georgia, serif;
        font-size: 31px;
        line-height: 1.32;
        color: var(--soft);
      }
      #badge {
        position: absolute;
        font-size: 120px;
        font-stretch: 62%;
        font-weight: 850;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        color: rgba(245, 247, 249, 0.92);
      }
      /* ---------------------------------------------------------------- two big figures (CO2) */
      #stats {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 300px;
        display: grid;
        gap: 70px;
      }
      #stats .n {
        font-size: 230px;
        font-stretch: 62%;
        font-weight: 850;
        line-height: 0.84;
        font-variant-numeric: tabular-nums;
      }
      #stats .l {
        margin-top: 14px;
        font-size: 48px;
        font-stretch: 78%;
        font-weight: 680;
        line-height: 1.12;
        max-width: 820px;
      }
      /* ---------------------------------------------------------------- title */
      #title {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 150px;
      }
      #title h1 {
        margin: 0;
        font-size: 196px;
        font-stretch: 62%;
        font-weight: 850;
        line-height: 0.86;
        letter-spacing: -0.012em;
      }
      #title h1 .l2 {
        color: #8fc2ff;
      }
      #title .sub {
        margin-top: 26px;
        font-size: 44px;
        font-stretch: 80%;
        font-weight: 620;
        color: var(--soft);
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 40px;
      }
      .chip img {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 28%;
        box-shadow:
          0 0 0 4px var(--navy),
          0 0 0 7px var(--blue);
      }
      .chip small {
        display: block;
        font-size: 28px;
        font-weight: 560;
        color: var(--soft);
      }
      .chip b {
        display: block;
        font-size: 44px;
        font-stretch: 78%;
        font-weight: 780;
      }
      .chip i {
        display: block;
        font-style: normal;
        font-size: 28px;
        font-weight: 620;
        color: #8fc2ff;
      }
      /* ---------------------------------------------------------------- call to action */
      #cta {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 170px;
      }
      #cta .q {
        font-size: 150px;
        font-stretch: 62%;
        font-weight: 850;
        line-height: 0.9;
      }
      #cta .lead {
        margin-top: 26px;
        font-size: 56px;
        font-stretch: 75%;
        font-weight: 700;
        line-height: 1.1;
      }
      #cta .action {
        margin-top: 70px;
        font-size: 46px;
        font-stretch: 80%;
        font-weight: 700;
        color: var(--soft);
      }
      #cta .pill {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        margin-top: 22px;
        padding: 26px 40px 28px 36px;
        border-radius: 999px;
        background: var(--white);
        color: var(--navy);
        font-size: 66px;
        font-stretch: 78%;
        font-weight: 800;
        transform-origin: 0 50%;
        text-shadow: none;
      }
      #cta .pill svg {
        width: 54px;
        height: 54px;
      }
      #cta .small {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 560;
        color: var(--soft);
      }
      #cta .chip {
        position: absolute;
        left: 0;
        top: 860px;
      }
      /* ---------------------------------------------------------------- footer and progress */
      #foot {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 46px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 29px;
        font-weight: 600;
        color: var(--soft);
      }
      #foot b {
        color: var(--white);
        font-weight: 760;
      }
      #foot .me {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #foot .me img {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 28%;
      }
      #progress {
        position: absolute;
        left: 0;
        top: 0;
        height: 6px;
        background: rgba(245, 247, 249, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" alt="" />
      <div id="tint"></div>
      <div id="shade"></div>
      <div id="shade-num"></div>
      <div id="chart"><img alt="" /></div>
      <div id="badge"></div>
      <div id="head" class="shadow"></div>
      <div id="note"></div>
      <div id="stats" class="shadow"></div>
      <div id="big" class="shadow"></div>
      <div id="top" class="shadow"></div>
      <div id="title" class="shadow"></div>
      <div id="cta" class="shadow"></div>
      <div id="foot" class="shadow">
        <span>Explorez les données : <b id="foot-url"></b></span>
        <span class="me"><img src="out/portrait.jpg" alt="" /><span id="foot-me"></span></span>
      </div>
      <div id="progress"></div>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const N = " ";
      const ACC = { white: "#f5f7f9", blue: "#4d9bff", magenta: "#ff4da6", teal: "#25c79c", ochre: "#f3b23c" };
      // French spacing: narrow no-break space before high punctuation and between a number and its unit
      const fr = (s) =>
        String(s)
          .replace(/ ([:;?!%])/g, `${N}$1`)
          .replace(/(\d) (M|k|kt|Mt|km)\b/g, `$1${N}$2`);
      const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const lin = (t, a, b) => clamp((t - a) / (b - a));
      const outCubic = (x) => 1 - (1 - x) ** 3;
      const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
      const pad = (f) => String(f).padStart(4, "0");

      let REEL, BEATS, TOTAL, FPS;
      const CHARTS = {};

      async function ready() {
        REEL = await (await fetch("reel.json")).json();
        const scenes = (await (await fetch("scenes.json")).json()).scenes;
        FPS = REEL.fps;
        let t = 0;
        BEATS = REEL.beats.map((b) => {
          const s = { ...b, start: t };
          t += b.dur;
          return s;
        });
        TOTAL = t;
        for (const b of BEATS.filter((b) => b.chart)) {
          const sc = scenes.find((s) => s.id === b.chart);
          const meta = await (await fetch(`out/raw-dark/${b.chart}/meta.json`)).json();
          CHARTS[b.chart] = { ...meta, frames: Math.round(((sc.reel && sc.reel.dur) || sc.dur) * FPS) };
        }
        $("#foot-url").textContent = REEL.url;
        $("#foot-me").textContent = REEL.author;
        await document.fonts.ready;
        return { total: TOTAL, fps: FPS };
      }

      // ---------------------------------------------------------------- text helpers
      /** words wrapped for a masked rise; number tokens become counters */
      function words(parts, accent) {
        const frag = document.createDocumentFragment();
        for (const p of [].concat(parts)) {
          if (typeof p === "string") {
            for (const [i, w] of fr(p).split(/( )/).entries()) {
              if (w === " ") frag.append(" ");
              else if (w) frag.append(wrap(w));
            }
          } else {
            const s = wrap("", "count");
            Object.assign(s.firstChild.dataset, { n: p.n, sign: p.sign || "", suffix: p.suffix || "" });
            s.firstChild.style.color = ACC[p.accent || accent] || ACC.white;
            frag.append(s);
          }
        }
        return frag;
      }
      function wrap(text, cls = "") {
        const o = document.createElement("span");
        o.className = "w";
        const i = document.createElement("span");
        if (cls) i.className = cls;
        i.textContent = text;
        o.append(i);
        return o;
      }
      function rise(root, u, start, step = 0.05, dur = 0.42) {
        root.querySelectorAll(".w > span").forEach((w, i) => {
          const k = outCubic(lin(u, start + i * step, start + i * step + dur));
          w.style.transform = `translateY(${((1 - k) * 105).toFixed(1)}%)`;
        });
      }
      function count(root, u, start, dur = 0.9) {
        root.querySelectorAll(".count").forEach((c) => {
          const k = outCubic(lin(u, start, start + dur));
          const v = Math.round(+c.dataset.n * k);
          c.textContent = fr(`${c.dataset.sign}${v}${c.dataset.suffix}`);
          if (c.dataset.unit) {
            const unit = document.createElement("span");
            unit.className = "unit";
            unit.textContent = c.dataset.unit.trim();
            c.append(unit);
          }
        });
      }
      function fade(node, u, inAt, outAt, d = 0.3, dy = 26) {
        const a = outCubic(lin(u, inAt, inAt + d));
        const b = outAt === null ? 0 : lin(u, outAt, outAt + 0.25);
        node.style.opacity = (a * (1 - b)).toFixed(3);
        node.style.transform = `translateY(${((1 - a) * dy - b * 18).toFixed(1)}px)`;
      }
      function chip(withLink) {
        const d = document.createElement("div");
        d.className = "chip";
        d.innerHTML = `<img src="out/portrait.jpg" alt=""><div><small>Une enquête en données de</small><b>${REEL.author}</b>${
          withLink ? `<i>${REEL.linkedin}</i>` : ""
        }</div>`;
        return d;
      }

      // ---------------------------------------------------------------- per-beat DOM, built once
      let built = null;
      function build(b) {
        for (const id of ["#head", "#note", "#stats", "#big", "#top", "#title", "#cta", "#badge"]) {
          $(id).replaceChildren();
          $(id).style.opacity = 0;
        }
        if (b.kind === "number") {
          const k = document.createElement("div");
          k.className = "kicker";
          k.append(words(b.kicker));
          const n = document.createElement("div");
          n.className = "num";
          n.append(words([{ n: b.n, sign: b.sign, suffix: b.suffix, accent: b.accent }]));
          if (b.unit) n.querySelector(".w").firstChild.dataset.unit = b.unit; // "183 millions", unit in smaller type
          if (b.top) $("#top").textContent = fr(b.top);
          const l = document.createElement("div");
          l.className = "line";
          l.append(words(b.line));
          $("#big").append(k, n, l);
        }
        if (b.kind === "chart") {
          const k = document.createElement("div");
          k.className = "kicker";
          k.style.color = ACC[b.accent];
          k.append(words(b.kicker));
          const h = document.createElement("h2");
          h.append(words(b.headline, b.accent));
          $("#head").append(k, h);
          $("#note").textContent = fr(b.note || "");
          if (b.stats)
            for (const s of b.stats) {
              const box = document.createElement("div");
              const n = document.createElement("div");
              n.className = "n";
              n.append(words([{ ...s }]));
              const l = document.createElement("div");
              l.className = "l";
              l.append(words(s.label));
              box.append(n, l);
              $("#stats").append(box);
            }
        }
        if (b.kind === "title") {
          const h = document.createElement("h1");
          b.title.forEach((line, i) => {
            const d = document.createElement("div");
            d.className = `l${i + 1}`;
            d.append(words(line));
            h.append(d);
          });
          const s = document.createElement("div");
          s.className = "sub";
          s.textContent = fr(b.sub);
          $("#title").append(h, s, chip(false));
        }
        if (b.kind === "cta") {
          const q = document.createElement("div");
          q.className = "q";
          q.append(words(b.q));
          const lead = document.createElement("div");
          lead.className = "lead";
          lead.append(words(b.lead));
          const a = document.createElement("div");
          a.className = "action";
          a.textContent = fr(b.action);
          const pill = document.createElement("div");
          pill.className = "pill";
          pill.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M3 12h18M12 2.8c2.6 2.6 3.9 5.7 3.9 9.2s-1.3 6.6-3.9 9.2M12 2.8C9.4 5.4 8.1 8.5 8.1 12s1.3 6.6 3.9 9.2"/></svg><span>${REEL.url}</span>`;
          const sm = document.createElement("div");
          sm.className = "small";
          sm.textContent = fr(b.small);
          $("#cta").append(q, lead, a, pill, sm, chip(true));
        }
        built = b.id;
      }

      // ---------------------------------------------------------------- frames
      async function setImg(img, src) {
        if (img.getAttribute("src") === src) return;
        img.setAttribute("src", src);
        await img.decode().catch(() => {});
      }

      async function render(t) {
        let k = BEATS.findIndex((b) => t < b.start + b.dur);
        if (k < 0) k = BEATS.length - 1;
        const b = BEATS[k];
        const u = t - b.start;
        if (built !== b.id) build(b);
        const loads = [];
        const f = Math.min(Math.round(b.dur * FPS) - 1, Math.floor(u * FPS + 1e-6));
        loads.push(setImg($("#bg"), `out/reel/bg/${b.id}/${pad(f)}.jpg`));

        // footage: clear on number beats, blurred and darkened under charts
        const zoom = 1.07 - 0.07 * inOut(lin(u, 0, b.dur));
        const arrive = 1 - outCubic(lin(u, 0, 0.45)); // 1 at the cut, 0 once settled
        const lean = inOut(lin(u, b.dur - 0.35, b.dur)); // grows into the next cut
        let blur = 0;
        let tint = 0.12;
        let bright = 0.92;
        if (b.kind === "title") tint = 0.18;
        if (b.kind === "number") bright = 0.82; // white figures must hold over a white fuselage
        if (b.kind === "cta") tint = 0.2 + 0.16 * lin(u, 0, 1.2); // the sunset stays visible behind the address
        let cu = u; // chart clock
        if (b.kind === "chart") {
          const s = b.stats ? b.statsDur : 0;
          cu = u - s;
          if (b.stats && u < s) {
            blur = 8 * lin(u, 0, 0.5);
            tint = 0.12 + 0.4 * lin(u, 0, 0.5);
          } else {
            const g = inOut(lin(cu, 0, 0.55));
            blur = (b.stats ? 8 : 0) + (b.stats ? 8 : 16) * g;
            tint = (b.stats ? 0.52 : 0.12) + (b.stats ? 0.08 : 0.48) * g;
            bright = 0.92 - 0.2 * g;
          }
        }
        const punch = k === 0 ? 0 : arrive; // the very first frame opens clean
        $("#bg").style.transform = `scale(${(zoom * (1 + blur / 900) * (1 + 0.1 * punch + 0.05 * lean)).toFixed(4)})`;
        $("#bg").style.filter = `blur(${(blur + 16 * punch + 8 * lean).toFixed(1)}px) brightness(${(bright * (1 + 0.25 * punch)).toFixed(3)}) saturate(1.08)`;
        $("#tint").style.opacity = tint.toFixed(3);
        $("#shade-num").style.opacity = b.kind === "number" ? 1 : 0;
        $("#shade").style.opacity = b.kind === "chart" && cu > 0 ? (1 - 0.5 * lin(cu, 0, 0.5)).toFixed(3) : 1;

        const end = b.dur - 0.28; // everything leaves just before the cut
        // ---------------- number beats
        if (b.kind === "number") {
          const big = $("#big");
          big.style.opacity = (1 - lin(u, end, end + 0.25)).toFixed(3);
          rise(big.querySelector(".kicker"), u, 0.05, 0.04);
          rise(big.querySelector(".num"), u, 0.12, 0, 0.5);
          count(big, u, 0.12, 0.95);
          const land = u > 1.07 ? 1 + 0.06 * (1 - outCubic(lin(u, 1.07, 1.4))) : 1;
          big.querySelector(".num").style.transform = `scale(${land.toFixed(4)})`;
          big.querySelector(".num").style.transformOrigin = "0 80%";
          rise(big.querySelector(".line"), u, 0.55, 0.05);
          const top = $("#top");
          top.style.opacity = (outCubic(lin(u, 0.0, 0.3)) * (1 - lin(u, end, end + 0.25))).toFixed(3);
        }
        // ---------------- title
        if (b.kind === "title") {
          const ti = $("#title");
          ti.style.opacity = (1 - lin(u, end, end + 0.25)).toFixed(3);
          rise(ti.querySelector("h1"), u, 0.05, 0.08, 0.5);
          fade(ti.querySelector(".sub"), u, 0.6, null);
          fade(ti.querySelector(".chip"), u, 0.95, null);
        }
        // ---------------- charts
        const chartBox = $("#chart");
        if (b.kind === "chart") {
          const st = $("#stats");
          if (b.stats) {
            st.style.opacity = (1 - lin(u, b.statsDur - 0.3, b.statsDur - 0.02)).toFixed(3);
            st.querySelectorAll(":scope > div").forEach((d, i) => {
              rise(d.querySelector(".n"), u, 0.1 + i * 0.35, 0, 0.5);
              count(d, u, 0.1 + i * 0.35, 0.9);
              rise(d.querySelector(".l"), u, 0.45 + i * 0.35, 0.03);
            });
          }
          const head = $("#head");
          head.style.opacity = cu < 0 ? 0 : (1 - lin(u, end, end + 0.25)).toFixed(3);
          rise(head.querySelector(".kicker"), cu, 0.02, 0.03);
          rise(head.querySelector("h2"), cu, 0.1, 0.035);
          count(head, cu, 0.2, 0.9);
          const C = CHARTS[b.chart];
          const maxW = b.chartWidth || 960;
          const headBottom = 96 + head.offsetHeight;
          const top0 = headBottom + 44;
          const note = $("#note");
          const noteH = note.textContent ? note.offsetHeight + 30 : 0;
          const room = 1350 - 140 - noteH - top0;
          const w = Math.min(maxW, (room * C.w) / C.h);
          const h = (w * C.h) / C.w;
          const x = (1080 - w) / 2;
          const y = top0 + Math.max(0, (room - h) / 2);
          const e = outCubic(lin(cu, 0.25, 0.85));
          const leave = lin(u, end, end + 0.25);
          Object.assign(chartBox.style, {
            width: `${w}px`,
            height: `${h}px`,
            transform: `translate(${x}px, ${(y + (1 - e) * 40).toFixed(1)}px) scale(${((0.96 + 0.04 * e) * (1 + 0.075 * inOut(lin(cu, 0.6, b.dur)))).toFixed(4)})`,
            opacity: cu < 0 ? 0 : (e * (1 - leave)).toFixed(3),
          });
          const cf = Math.max(0, Math.min(C.frames - 1, Math.round((b.chartFrom || 0) * FPS) + Math.floor(Math.max(0, cu - 0.25) * FPS * (b.chartRate || 1))));
          loads.push(setImg(chartBox.querySelector("img"), `out/raw-dark/${b.chart}/${pad(cf)}.png`));
          const wipe = b.reveal === "wipe" ? inOut(lin(cu, 0.3, 3.3)) : 1;
          chartBox.querySelector("img").style.clipPath =
            wipe < 1 ? `inset(-2% ${((1 - wipe) * 100).toFixed(2)}% -2% -2%)` : "none";
          note.style.top = `${y + h + 26}px`;
          note.style.opacity = cu < 0 ? 0 : (outCubic(lin(cu, 0.8, 1.2)) * (1 - leave)).toFixed(3);
          const badge = $("#badge");
          if (b.badge && C.live) {
            badge.textContent = C.live[cf];
            Object.assign(badge.style, {
              left: `${x + w - 250}px`,
              top: `${y + 6}px`,
              opacity: (outCubic(lin(cu, 0.5, 0.9)) * (1 - leave)).toFixed(3),
            });
          }
        } else chartBox.style.opacity = 0;
        // ---------------- call to action
        if (b.kind === "cta") {
          const c = $("#cta");
          c.style.opacity = 1;
          rise(c.querySelector(".q"), u, 0.1, 0.06, 0.5);
          rise(c.querySelector(".lead"), u, 0.55, 0.03);
          fade(c.querySelector(".action"), u, 1.15, null);
          const p = c.querySelector(".pill");
          const pk = outCubic(lin(u, 1.35, 1.75));
          const pulse = u > 2.2 ? 1 + 0.025 * Math.sin((u - 2.2) * 4.2) : 1;
          p.style.opacity = pk.toFixed(3);
          p.style.transform = `scale(${((0.85 + 0.15 * pk) * pulse).toFixed(4)})`;
          p.style.boxShadow = `0 0 0 ${(u > 2.2 ? 8 + 8 * (0.5 + 0.5 * Math.sin((u - 2.2) * 4.2)) : 0).toFixed(1)}px rgba(77,155,255,0.28)`;
          fade(c.querySelector(".small"), u, 1.9, null);
          fade(c.querySelector(".chip"), u, 2.3, null);
        }
        // ---------------- footer and progress
        const showFoot = b.kind !== "title" && b.kind !== "cta";
        $("#foot").style.opacity = showFoot ? (t < 0.5 ? lin(t, 0.2, 0.5) : 1).toFixed(3) : 0;
        $("#progress").style.width = `${((t / TOTAL) * 100).toFixed(3)}%`;
        await Promise.all(loads);
      }
      window.render = render;
      window.ready = ready();
    </script>
  </body>
</html>
