<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Quand les avions heurtent-ils des oiseaux ? Vidéo LinkedIn</title>
    <style>
      /* A 1080x1350 (4:5) LinkedIn video for « Quand les avions heurtent-ils des oiseaux ? » (web/oiseaux/). Free Pexels footage
         (promo/oiseaux.json, cut by reel_footage.py --config promo/oiseaux.json) under one animated idea per beat,
         readable without sound. Every number is computed from the investigation's own data file with its own code
         (web/src/birds/facts.js). Rendered frame by frame by render.py (window.ready, window.render(t)). */
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2)
          format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+2000-206F, U+2212, U+00D7;
      }
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/src/fonts/nnbsp.woff) format("woff");
        unicode-range: U+202F;
      }
      @font-face {
        font-family: "Source Serif 4 Variable";
        font-weight: 200 900;
        src: url(../web/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2)
          format("woff2-variations");
      }
      :root {
        --night: #0b1522;
        --ink: #f3f6f9;
        --soft: rgba(243, 246, 249, 0.8);
        --magenta: #ff4fa8;
        --blue: #5aa2ff;
        --grey: rgba(243, 246, 249, 0.28);
      }
      html,
      body {
        margin: 0;
        background: var(--night);
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--night);
        color: var(--ink);
        font-family: "Archivo Variable", "Arial Narrow", sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: 50% 45%;
      }
      #tint {
        position: absolute;
        inset: 0;
        background: var(--night);
      }
      #shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            rgba(6, 12, 20, 0.7) 0%,
            rgba(6, 12, 20, 0) 22%
          ),
          linear-gradient(
            to top,
            rgba(6, 12, 20, 0.92) 0%,
            rgba(6, 12, 20, 0.55) 34%,
            rgba(6, 12, 20, 0) 62%
          );
      }
      /* the story's progress, as in a story: one segment a beat */
      #bars {
        position: absolute;
        top: 34px;
        left: 56px;
        right: 56px;
        display: flex;
        gap: 8px;
      }
      #bars i {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.28);
        overflow: hidden;
      }
      #bars i b {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
      }
      #top {
        position: absolute;
        top: 64px;
        left: 56px;
        right: 56px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 30px;
      }
      .mark {
        color: var(--ink);
      }
      .mark b {
        font-weight: 800;
      }
      .tag {
        padding: 9px 18px;
        border-radius: 999px;
        background: var(--magenta);
        color: #fff;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #layer {
        position: absolute;
        inset: 0;
      }
      .bottom {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 96px;
      }
      .kicker {
        margin: 0 0 14px;
        font-size: 36px;
        font-weight: 700;
        color: var(--soft);
      }
      .h {
        margin: 0;
        font-weight: 800;
        font-stretch: 70%;
        font-size: 112px;
        line-height: 0.98;
        letter-spacing: -0.01em;
      }
      .h .m {
        color: var(--magenta);
      }
      .big {
        margin: 0;
        font-weight: 800;
        font-stretch: 66%;
        font-size: 250px;
        line-height: 0.85;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .big.m {
        color: var(--magenta);
      }
      .line {
        margin: 18px 0 0;
        font:
          600 46px/1.18 "Source Serif 4 Variable",
          Georgia,
          serif;
        color: var(--ink);
        max-width: 18em;
      }
      .note {
        margin: 22px 0 0;
        font-size: 26px;
        color: var(--soft);
      }
      .w {
        display: inline-block;
        will-change: transform, opacity;
      }
      /* planes */
      .planes {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 14px;
        margin-bottom: 34px;
      }
      .planes svg {
        width: 100%;
        height: auto;
        overflow: visible;
      }
      /* the clock */
      .clock {
        position: absolute;
        left: 50%;
        top: 330px;
        width: 520px;
        height: 520px;
        margin-left: -260px;
      }
      /* the chart panel */
      .panel {
        position: absolute;
        left: 56px;
        right: 56px;
        top: 170px;
        padding: 30px 34px 26px;
        border-radius: 18px;
        background: rgba(8, 16, 27, 0.78);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      }
      .panel h3 {
        margin: 0 0 6px;
        font-weight: 800;
        font-stretch: 72%;
        font-size: 46px;
        line-height: 1.02;
      }
      .panel p {
        margin: 0 0 14px;
        font-size: 24px;
        color: var(--soft);
      }
      .panel svg text {
        font-family: "Archivo Variable", sans-serif;
        fill: var(--soft);
        font-size: 22px;
      }
      #credit {
        position: absolute;
        right: 22px;
        bottom: 14px;
        font-size: 17px;
        color: rgba(255, 255, 255, 0.55);
      }
      .pill {
        display: inline-block;
        margin-top: 34px;
        padding: 22px 32px;
        border-radius: 16px;
        background: var(--ink);
        color: var(--night);
        font-weight: 800;
        font-size: 40px;
      }
      .map {
        display: block;
        width: 100%;
        border-radius: 10px;
      }
      .maps {
        display: grid;
        gap: 14px;
      }
      .maps b {
        display: block;
        font-size: 34px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .maps b span {
        float: right;
        color: var(--soft);
        font-weight: 800;
        font-size: 40px;
      }
      .maps .last b span {
        color: var(--magenta);
      }
      .ramp {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        font-size: 22px;
        color: var(--soft);
      }
      .ramp i {
        width: 220px;
        height: 12px;
        border-radius: 6px;
        background: linear-gradient(90deg, #13263b, #1c4a82, #4f8fd6, #c85fb0, #ff6fb6);
      }
      .grids {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
      }
      .grids b {
        display: block;
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 12px;
      }
      .grids b span {
        color: var(--magenta);
      }
      .author {
        margin-top: 24px;
        font-size: 28px;
        color: var(--soft);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" alt="" />
      <div id="tint"></div>
      <div id="shade"></div>
      <div id="layer"></div>
      <div id="bars"></div>
      <div id="top">
        <span class="mark">aviation<b>data</b></span
        ><span class="tag">Sécurité</span>
      </div>
      <div id="credit">Vidéos : Pexels</div>
    </div>
    <script type="module">
      import { birdFacts, openingNumbers, NIGHT } from "../web/src/birds/facts.js";

      const CFG = await fetch("oiseaux.json").then((r) => r.json());
      const B = await fetch("../web/public/data/birds/birds.json").then((r) => r.json());
      const F = birdFacts(B);
      const FPS = CFG.fps;
      const $ = (s) => document.querySelector(s);
      const fr = (v, d = 0) =>
        v.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ | /g, " ");
      const pad = (n) => String(n).padStart(4, "0");
      const lin = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
      const outCubic = (x) => 1 - (1 - x) ** 3;
      const outBack = (x) => 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2;
      const inOut = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
      const rise = (el, u, a, dy = 40) => {
        const g = outCubic(lin(u, a, a + 0.45));
        el.style.opacity = g;
        el.style.transform = `translateY(${(1 - g) * dy}px)`;
      };
      const pc = (v, d = 0) => `${fr(v * 100, d)} %`;
      const OPEN = openingNumbers(F);
      const MONTHS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
      // night ramp, as SEQ_NIGHT of the chart kit
      const STOPS = ["#13263b", "#1c4a82", "#4f8fd6", "#c85fb0", "#ff6fb6"].map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
      const ramp = (t) => {
        t = Math.max(0, Math.min(1, t)) * (STOPS.length - 1);
        const i = Math.min(STOPS.length - 2, Math.floor(t));
        const f = t - i;
        return `rgb(${STOPS[i].map((v, k) => Math.round(v + (STOPS[i + 1][k] - v) * f)).join(",")})`;
      };
      const sector = (r0, r1, a0, a1) => {
        const p = (r, a) => `${r * Math.sin(a)} ${-r * Math.cos(a)}`;
        return `M${p(r0, a0)} L${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)} Z`;
      };

      let t0 = 0;
      const BEATS = CFG.beats.map((b) => {
        const o = { ...b, start: t0 };
        t0 += b.dur;
        return o;
      });
      const TOTAL = t0;
      $("#bars").innerHTML = BEATS.map(() => "<i><b></b></i>").join("");

      const B_ = {
        hook: {
          html: `<div class="bottom">
              <p class="h"><span class="w" id="h1">Décollage.</span><br><span class="w m" id="h2">Un choc sourd.</span></p>
              <p class="line w" id="h3">Un oiseau vient de heurter l'avion.</p></div>`,
          frame(u) {
            rise($("#h1"), u, 0.15);
            rise($("#h2"), u, 1.0);
            rise($("#h3"), u, 1.9, 26);
          },
          tint: 0.15,
        },
        day: {
          html: `<div class="bottom">
              <p class="kicker w" id="k" style="display:block">Aux États-Unis, de ${F.p0} à ${F.p1}</p>
              <p class="big m w" id="n" style="display:block">0</p>
              <p class="line w" id="l">impacts d'oiseaux ou d'autres animaux déclarés chaque jour.</p>
              <p class="note w" id="no">Près de ${fr(Math.round(F.perYear / 100) * 100)} par an.</p></div>`,
          frame(u) {
            rise($("#k"), u, 0.05, 20);
            $("#n").textContent = fr(Math.round(F.perDay * inOut(lin(u, 0.3, 1.8))));
            $("#n").style.opacity = lin(u, 0.2, 0.5);
            rise($("#l"), u, 1.6, 24);
            rise($("#no"), u, 2.3, 16);
          },
          tint: 0.4,
        },
        clock: {
          html: `<div class="panel w" id="p" style="top:150px"><h3>L'horloge des impacts</h3>
              <p>Un anneau par mois, de janvier au centre à décembre au bord ; minuit en haut. Plus c'est clair, plus d'impacts.</p>
              <svg viewBox="-300 -300 600 600" width="900" height="600" id="ck"></svg></div>
            <div class="bottom"><p class="line w" id="l">La nuit, deux pointes : ${MONTHS[F.spring]} et ${MONTHS[F.autumn]}, les mois des migrations.</p></div>`,
          build() {
            const max = Math.max(...B.clock.flat());
            let s = "";
            const r0 = 60, ring = 18;
            for (let k = 0; k < 12; k++)
              for (let h = 0; h < 24; h++) {
                const v = B.clock[h][k];
                const a0 = (h / 24) * 2 * Math.PI + 0.006, a1 = ((h + 1) / 24) * 2 * Math.PI - 0.006;
                s += `<path class="cs" data-k="${k}" data-n="${NIGHT.includes(h) ? 1 : 0}" d="${sector(r0 + k * ring + 0.8, r0 + (k + 1) * ring - 0.8, a0, a1)}" fill="${ramp(Math.min(1, v / max) ** 0.7)}"/>`;
              }
            for (const h of [0, 6, 12, 18]) {
              const a = (h / 24) * 2 * Math.PI;
              s += `<text x="${Math.sin(a) * 292}" y="${-Math.cos(a) * 292 + 8}" text-anchor="middle">${h} h</text>`;
            }
            // the night, outlined
            const nA0 = (21 / 24) * 2 * Math.PI, nA1 = (29 / 24) * 2 * Math.PI;
            s += `<path id="night" d="${sector(r0 - 4, r0 + 12 * ring + 4, nA0, nA1)}" fill="none" stroke="#ff4fa8" stroke-width="4" stroke-dasharray="10 8"/>`;
            $("#ck").innerHTML = s;
          },
          frame(u) {
            rise($("#p"), u, 0.05, 30);
            document.querySelectorAll("#ck .cs").forEach((c) => (c.style.opacity = outCubic(lin(u, 0.3 + +c.dataset.k * 0.12, 0.6 + +c.dataset.k * 0.12))));
            $("#night").style.opacity = lin(u, 2.4, 2.8);
            rise($("#l"), u, 2.8, 24);
          },
          tint: 0.6,
        },
        height: {
          html: `<div class="panel w" id="p"><h3>Presque tout se joue près du sol</h3>
              <p>Impacts déclarés selon la hauteur ; en rose, ceux qui ont abîmé l'avion</p>
              <svg viewBox="0 0 900 420" width="900" height="420" id="ch"></svg></div>
            <div class="bottom"><p class="big m w" id="n">${OPEN[1].value}</p>
              <p class="line w" id="l">ont lieu à moins de 150 mètres du sol.</p>
              <p class="note w" id="no">Mais au-dessus de 3 000 m, ${pc(F.high.rate)} abîment l'avion, contre ${pc(F.groundRate)} au sol.</p></div>`,
          build() {
            const H = [...F.heights].reverse();
            const names = ["+ 3 000 m", "3 000 m", "1 500 m", "900 m", "600 m", "300 m", "150 m", "30 m", "au sol"];
            const max = Math.max(...H.map((h) => h.n));
            let s = "";
            H.forEach((h, i) => {
              const y = 10 + i * 45;
              const w = 640 * (h.n / max);
              s += `<text x="120" y="${y + 24}" text-anchor="end">${names[i]}</text>`;
              s += `<rect class="hb" data-i="${i}" data-w="${Math.max(3, w)}" x="140" y="${y + 6}" height="26" rx="5" width="0" fill="#5aa2ff" opacity=".8"/>`;
              s += `<rect class="hd" data-i="${i}" data-w="${Math.max(3, w * h.rate)}" x="140" y="${y + 6}" height="26" rx="5" width="0" fill="#ff4fa8"/>`;
              s += `<text class="hr" data-i="${i}" x="${150 + Math.max(3, w)}" y="${y + 26}" style="fill:#f3f6f9;font-weight:800">${pc(h.rate)}</text>`;
            });
            $("#ch").innerHTML = s;
          },
          frame(u) {
            rise($("#p"), u, 0.05, 30);
            document.querySelectorAll("#ch .hb, #ch .hd").forEach((r) => {
              const i = 8 - +r.dataset.i;
              r.setAttribute("width", +r.dataset.w * outCubic(lin(u, 0.3 + i * 0.1, 0.9 + i * 0.1)));
            });
            document.querySelectorAll("#ch .hr").forEach((r) => (r.style.opacity = lin(u, 1.8, 2.2)));
            rise($("#n"), u, 2.0);
            rise($("#l"), u, 2.4, 24);
            rise($("#no"), u, 3.0, 16);
          },
          tint: 0.55,
        },
        size: {
          html: `<div class="panel w" id="p"><h3>Les petits sont nombreux, les gros font les dégâts</h3>
              <p>Sur 100 impacts déclarés, combien ont abîmé l'avion</p>
              <div class="grids"><div><b>Petit oiseau <span>${fr(Math.round(F.sizes.petit.rate * 100))}</span></b><svg viewBox="0 0 400 400" width="420" height="420" id="g0"></svg></div>
              <div><b>Gros oiseau ou animal <span>${fr(Math.round(F.sizes.grand.rate * 100))}</span></b><svg viewBox="0 0 400 400" width="420" height="420" id="g1"></svg></div></div></div>
            <div class="bottom"><p class="big m w" id="n">${OPEN[2].value}</p>
              <p class="line w" id="l">des chocs avec un gros oiseau abîme l'avion. Avec un petit oiseau, 1 sur ${fr(Math.round(1 / F.sizes.petit.rate))}.</p></div>`,
          build() {
            for (const [id, rate] of [["#g0", F.sizes.petit.rate], ["#g1", F.sizes.grand.rate]]) {
              const red = Math.round(rate * 100);
              let s = "";
              for (let i = 0; i < 100; i++)
                s += `<rect class="sq" data-i="${i}" data-r="${i < red ? 1 : 0}" x="${(i % 10) * 40 + 3}" y="${Math.floor(i / 10) * 40 + 3}" width="34" height="34" rx="6" fill="rgba(90,162,255,.55)"/>`;
              $(id).innerHTML = s;
            }
          },
          frame(u) {
            rise($("#p"), u, 0.05, 30);
            document.querySelectorAll(".sq").forEach((r) => {
              const i = +r.dataset.i;
              r.style.opacity = lin(u, 0.3 + i * 0.008, 0.5 + i * 0.008);
              r.setAttribute("fill", +r.dataset.r && u > 1.4 + i * 0.012 ? "#ff4fa8" : "rgba(90,162,255,.55)");
            });
            rise($("#n"), u, 2.4);
            rise($("#l"), u, 2.8, 24);
          },
          tint: 0.55,
        },
        reports: {
          html: `<div class="panel w" id="p"><h3>On déclare bien plus, on n'abîme pas bien plus</h3>
              <p>Chaque année, en multiple de ${F.first}</p>
              <svg viewBox="0 0 900 430" width="900" height="430" id="ch"></svg></div>
            <div class="bottom"><p class="big w" id="n"><span class="m">× ${fr(F.reportsRatio, 1)}</span></p>
              <p class="line w" id="l">déclarations depuis ${F.first}. Les impacts avec dégâts : × ${fr(F.dmgRatio, 1)}.</p></div>`,
          build() {
            const ys = Object.keys(B.years).map(Number);
            const rep = ys.map((y) => B.years[y][0] / F.reports0);
            const dmg = ys.map((y) => B.years[y][1] / F.dmg0);
            const W = 900, H = 430, L = 60, R = 150, T = 20, Bm = 44;
            const max = Math.ceil(Math.max(...rep));
            const X = (i) => L + (i / (ys.length - 1)) * (W - L - R);
            const Y = (v) => H - Bm - (v / max) * (H - Bm - T);
            let s = "";
            for (let v = 0; v <= max; v += 4)
              s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,${v ? 0.12 : 0.4})" stroke-dasharray="${v ? "3 6" : ""}"/><text x="${L - 10}" y="${Y(v) + 7}" text-anchor="end">${v ? "× " + v : "0"}</text>`;
            [0, 10, 20, 30, ys.length - 1].forEach((i) => (s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${ys[i]}</text>`));
            const d = (v) => v.map((x, i) => `${i ? "L" : "M"}${X(i)},${Y(x)}`).join("");
            s += `<path class="ln" d="${d(rep)}" fill="none" stroke="#5aa2ff" stroke-width="7" stroke-linejoin="round"/>`;
            s += `<path class="ln" d="${d(dmg)}" fill="none" stroke="#ff4fa8" stroke-width="7" stroke-linejoin="round"/>`;
            s += `<text id="e0" x="${X(ys.length - 1) + 12}" y="${Y(rep.at(-1)) + 8}" style="fill:#5aa2ff;font-weight:800;font-size:28px">déclarés</text>`;
            s += `<text id="e1" x="${X(ys.length - 1) + 12}" y="${Y(dmg.at(-1)) + 8}" style="fill:#ff4fa8;font-weight:800;font-size:28px">dégâts</text>`;
            $("#ch").innerHTML = s;
          },
          frame(u) {
            rise($("#p"), u, 0.05, 30);
            const g = inOut(lin(u, 0.4, 2.4));
            document.querySelectorAll("#ch .ln").forEach((ln) => {
              const len = ln.getTotalLength();
              ln.style.strokeDasharray = `${len}`;
              ln.style.strokeDashoffset = `${len * (1 - g)}`;
            });
            $("#e0").style.opacity = $("#e1").style.opacity = lin(u, 2.3, 2.6);
            rise($("#n"), u, 2.4);
            rise($("#l"), u, 2.8, 24);
          },
          tint: 0.55,
        },
        cta: {
          html: `<div class="bottom" style="bottom:110px">
              <p class="kicker w" id="k">À quelle heure ? À quelle hauteur ? Quels oiseaux ?</p>
              <p class="h w" id="h">Quand les avions heurtent-ils des oiseaux ?</p>
              <p class="line w" id="l">Toute l'enquête : 36 ans d'impacts déclarés à la FAA, en huit figures.</p>
              <span class="pill w" id="u">${CFG.url} →</span>
              <p class="author w" id="a">Une enquête en données de ${CFG.author}</p></div>`,
          frame(u) {
            rise($("#k"), u, 0.1, 20);
            rise($("#h"), u, 0.45);
            rise($("#l"), u, 1.1, 24);
            rise($("#u"), u, 1.7, 24);
            rise($("#a"), u, 2.1, 16);
          },
          tint: 0.42,
        },
      };

      let built = null;
      function build(b) {
        built = b.id;
        $("#layer").innerHTML = B_[b.id].html;
        B_[b.id].build?.();
      }
      async function setImg(img, src) {
        if (img.getAttribute("src") === src) return;
        img.setAttribute("src", src);
        await img.decode().catch(() => {});
      }
      async function render(t) {
        let k = BEATS.findIndex((b) => t < b.start + b.dur);
        if (k < 0) k = BEATS.length - 1;
        const b = BEATS[k];
        const u = t - b.start;
        if (built !== b.id) build(b);
        const f = Math.min(Math.round(b.dur * FPS) - 1, Math.floor(u * FPS + 1e-6));
        const load = setImg($("#bg"), `out/${CFG.name}/bg/${b.id}/${pad(f)}.jpg`);
        // a jolt on the hook's « choc »
        const jolt = b.id === "hook" ? 10 * Math.max(0, 1 - Math.abs(u - 1.05) / 0.25) * Math.sin(u * 70) : 0;
        $("#bg").style.transform = `translate(${jolt}px, ${jolt * 0.6}px) scale(${1.08 - 0.08 * inOut(lin(u, 0, b.dur)) + (jolt ? 0.03 : 0)})`;
        const cut = 1 - outCubic(lin(u, 0, 0.3));
        const out = k < BEATS.length - 1 ? inOut(lin(u, b.dur - 0.25, b.dur)) : lin(u, b.dur - 0.5, b.dur);
        $("#tint").style.opacity = Math.min(1, B_[b.id].tint + 0.75 * Math.max(cut, out));
        $("#layer").style.opacity = 1 - out;
        B_[b.id].frame(u);
        document.querySelectorAll("#bars b").forEach((el, i) => {
          el.style.width = `${i < k ? 100 : i > k ? 0 : lin(u, 0, b.dur) * 100}%`;
        });
        await load;
        await document.fonts.ready;
      }
      window.render = render;
      window.ready = (async () => {
        await document.fonts.ready;
        return { total: TOTAL, fps: FPS };
      })();
    </script>
  </body>
</html>
