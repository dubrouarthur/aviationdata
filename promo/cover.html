<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Miniatures LinkedIn des vidéos</title>
    <style>
      /* LinkedIn covers (1080 x 1350, the 4:5 of the videos) for the videos of « Qui retarde les avions en Europe ? »
         (?v=retards) and « Quand les avions heurtent-ils des oiseaux ? » (?v=oiseaux): a still of the video's own
         footage (promo/out/<name>/bg, never versioned), the hook, the strong number and a small drawing of the key
         figure. Every number is computed by the investigation's own facts.js. Rendered by promo/cover.py. */
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2)
          format("woff2-variations");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+2000-206F, U+2212, U+00D7;
      }
      @font-face {
        font-family: "Archivo Variable";
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url(../web/src/fonts/nnbsp.woff) format("woff");
        unicode-range: U+202F;
      }
      @font-face {
        font-family: "Source Serif 4 Variable";
        font-weight: 200 900;
        src: url(../web/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2)
          format("woff2-variations");
      }
      html, body { margin: 0; background: #0b1522; }
      #c { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #f3f6f9;
        font-family: "Archivo Variable", "Arial Narrow", sans-serif; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #shade { position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(6,12,20,.75) 0%, rgba(6,12,20,.15) 22%, rgba(6,12,20,.45) 36%, rgba(6,12,20,.93) 60%, rgba(6,12,20,.98) 100%); }
      .top { position: absolute; top: 56px; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: center; font-size: 34px; }
      .top b { font-weight: 800; }
      .tag { padding: 10px 20px; border-radius: 999px; background: #ff4fa8; color: #fff; font-weight: 800; font-size: 24px; letter-spacing: .08em; text-transform: uppercase; }
      .fig { position: absolute; right: 56px; top: 150px; }
      .bottom { position: absolute; left: 64px; right: 64px; bottom: 80px; }
      .kicker { margin: 0 0 18px; font-size: 38px; font-weight: 700; color: rgba(243,246,249,.85); }
      .big { margin: 0; font-weight: 800; font-stretch: 64%; font-size: 300px; line-height: .82; color: #ff4fa8; font-variant-numeric: tabular-nums; }
      .h { margin: 30px 0 0; font-weight: 800; font-stretch: 72%; font-size: 78px; line-height: 1; }
      .nw { white-space: nowrap; }
      .line { margin: 22px 0 0; font: 600 40px/1.2 "Source Serif 4 Variable", Georgia, serif; color: rgba(243,246,249,.9); max-width: 19em; }
      .row { display: flex; align-items: center; gap: 22px; margin-top: 40px; }
      .play { display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 16px; background: #f3f6f9; color: #0b1522; font-weight: 800; font-size: 34px; }
      .play i { width: 0; height: 0; border-left: 24px solid #ff4fa8; border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
      .url { font-size: 30px; color: rgba(243,246,249,.75); }
      .fig text { font: 700 20px "Archivo Variable", sans-serif; fill: rgba(243,246,249,.85); }
    </style>
  </head>
  <body>
    <div id="c">
      <img id="bg" alt="" />
      <div id="shade"></div>
      <div class="top"><span>aviation<b>data</b></span><span class="tag" id="tag"></span></div>
      <svg class="fig" id="fig"></svg>
      <div class="bottom" id="b"></div>
    </div>
    <script type="module">
      import { atfmFacts } from "../web/src/atfm/facts.js";
      import { birdFacts } from "../web/src/birds/facts.js";
      const v = new URLSearchParams(location.search).get("v");
      const $ = (s) => document.querySelector(s);
      const fr = (x, d = 0) => x.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d }).replace(/ | /g, " ");
      const STOPS = ["#13263b", "#1c4a82", "#4f8fd6", "#c85fb0", "#ff6fb6"].map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
      const ramp = (t) => {
        t = Math.max(0, Math.min(1, t)) * (STOPS.length - 1);
        const i = Math.min(STOPS.length - 2, Math.floor(t));
        const f = t - i;
        return `rgb(${STOPS[i].map((x, k) => Math.round(x + (STOPS[i + 1][k] - x) * f)).join(",")})`;
      };
      const sector = (r0, r1, a0, a1) => {
        const p = (r, a) => `${r * Math.sin(a)} ${-r * Math.cos(a)}`;
        return `M${p(r0, a0)} L${p(r1, a0)} A${r1} ${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0} ${r0} 0 0 0 ${p(r0, a0)} Z`;
      };
      if (v === "oiseaux") {
        const B = await fetch("../web/public/data/birds/birds.json").then((r) => r.json());
        const F = birdFacts(B);
        $("#bg").src = "out/oiseaux/bg/day/0050.jpg";
        $("#tag").textContent = "Sécurité";
        // the year as a clock: a ring a month, a sector an hour
        const max = Math.max(...B.clock.flat());
        let s = `<circle r="214" fill="rgba(8,16,27,.78)"/>`;
        for (let k = 0; k < 12; k++)
          for (let h = 0; h < 24; h++)
            s += `<path d="${sector(46 + k * 14 + 0.6, 46 + (k + 1) * 14 - 0.6, (h / 24) * 2 * Math.PI + 0.006, ((h + 1) / 24) * 2 * Math.PI - 0.006)}" fill="${ramp(Math.min(1, B.clock[h][k] / max) ** 0.7)}"/>`;
        s += `<text y="-224" text-anchor="middle">minuit</text><text y="240" text-anchor="middle">midi</text>`;
        const fig = $("#fig");
        fig.setAttribute("viewBox", "-250 -250 500 500");
        fig.setAttribute("width", "430");
        fig.setAttribute("height", "430");
        fig.innerHTML = s;
        $("#b").innerHTML = `<p class="kicker">Aux États-Unis, chaque jour</p>
          <p class="big">${fr(Math.round(F.perDay))}</p>
          <p class="h">chocs entre avions et animaux</p>
          <p class="line">La nuit, l'été, près du sol : quand les avions heurtent-ils des oiseaux ?</p>
          <div class="row"><span class="play"><i></i>Vidéo · 32 s</span><span class="url">aviationdata.vercel.app/oiseaux</span></div>`;
      } else {
        const A = await fetch("../web/public/data/atfm/atfm.json").then((r) => r.json());
        const F = atfmFacts(A);
        $("#bg").src = "out/retards/bg/hook/0030.jpg";
        $("#tag").textContent = "Contrôle aérien";
        // the delay per flight, year after year
        const ys = F.years;
        const per = ys.map((k) => A.years[k].perFlight);
        const W = 440, H = 250, mx = Math.max(...per);
        const X = (i) => 20 + (i / (ys.length - 1)) * (W - 40);
        const Y = (x) => H - 40 - (x / mx) * (H - 70);
        const d = per.map((x, i) => `${i ? "L" : "M"}${X(i)},${Y(x)}`).join("");
        const fig = $("#fig");
        fig.setAttribute("viewBox", `0 0 ${W} ${H}`);
        fig.setAttribute("width", "440");
        fig.setAttribute("height", "250");
        fig.innerHTML = `<rect width="${W}" height="${H}" rx="18" fill="rgba(8,16,27,.78)"/>
          <text x="20" y="34">Retard par vol en Europe</text>
          <path d="${d}" fill="none" stroke="#ff4fa8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="${X(ys.length - 1)}" cy="${Y(per.at(-1))}" r="9" fill="#ff4fa8"/>
          <text x="20" y="${H - 12}">${ys[0]}</text><text x="${W - 20}" y="${H - 12}" text-anchor="end">${ys.at(-1)}</text>`;
        $("#b").innerHTML = `<p class="kicker">Votre avion est prêt. Il ne décolle pas.</p>
          <p class="big">× ${fr(F.ratio, 1)}</p>
          <p class="h">de retard par vol qu'en <span class="nw">2014-2017</span></p>
          <p class="line">En ${F.year}, 1 vol sur ${fr(Math.round(1 / F.delayed))} a attendu au sol un créneau du contrôle aérien. Qui retarde les avions en Europe ?</p>
          <div class="row"><span class="play"><i></i>Vidéo · 29 s</span><span class="url">aviationdata.vercel.app/retards</span></div>`;
      }
      await $("#bg").decode().catch(() => {});
      await document.fonts.ready;
      window.done = true;
    </script>
  </body>
</html>
