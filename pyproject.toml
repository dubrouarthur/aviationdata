[project]
name = "aviationdata-etl"
version = "0.1.0"
description = "ETL for the 'Le ciel à deux vitesses' dashboard (DGAC open data)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402", "B905"] # tests and scripts add etl/ to sys.path before importing

[tool.pytest.ini_options]
testpaths = ["tests"]
